# DOC-RT default config. Hydra-composable; standalone scripts read via OmegaConf.
# DOC-RT = RT cell-token substrate + documentation-conditioned cell encoding (FiLM). No temporal
# geometry, no tau, no scale-equivariance (those were the retired HALOS design; see archive/halos/).
seed: 0

data:
  dataset: rel-f1
  task: driver-dnf
  sampler:
    num_neighbors: [12, 12]    # per-hop fanout for the leakage-safe temporal neighbor sampler
  collate:
    seq_len: 512               # fixed cell-token cap per seed; rel-f1 max≈353 cells/seed -> 0% truncation
    max_fk: 5                  # max foreign-key neighbors per row (RT f2p_nbr width)

docs:
  # full | null (docs OFF = RT names-only) | shuffled (placebo) | name_only (RELATE-style control)
  regime: full
  encoder: Qwen/Qwen3-Embedding-4B
  d_text: 2560                 # VERIFY at first cache build; flows into FiLM + the RT name token
  grounding:
    chunk_sentences: 3         # ~2-4 sentence spans
    top_k: 4                   # spans pooled per schema element
    # below this max-cosine -> d_null fallback. CALIBRATED for Qwen3-Embedding-4B (sims ~0.52-0.85).
    sim_threshold: 0.60
    temp: 0.1                  # softmax temperature over cosine sims

model:
  d_model: 256
  n_heads: 8
  n_blocks: 8                  # RelationalBlocks (each = col/feat/nbr/full attention + SwiGLU FFN)
  d_ff: 1024                   # SwiGLU inner dim (null -> 4*d_model)
  enc_channels: 256            # pytorch-frame stype-encoder out channels

train:
  batch_size: 64
  lr: 3.0e-4
  weight_decay: 0.01
  max_epochs: 10
  num_workers: 0
