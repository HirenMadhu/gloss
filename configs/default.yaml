# HALOS default config (v3: documentation-conditioned geometry).
# Hydra-composable; standalone scripts read via OmegaConf. Phase-specific keys are documented inline.
seed: 0

data:
  dataset: rel-f1
  task: driver-dnf
  sampler:
    num_neighbors: [12, 12]   # count/order-based (required for scale-equivariance); per-hop fanout
    max_nodes: 4096           # cap on sampled subgraph size (pairwise bias is O(N^2))

docs:
  regime: full                # full | shuffled_spans (placebo) | null
  encoder: Qwen/Qwen3-Embedding-4B
  d_text: 2560                # VERIFY at first cache build; flows into FiLM + g_theta
  grounding:
    chunk_sentences: 3        # ~2-4 sentence spans
    top_k: 4                  # spans pooled per schema element
    sim_threshold: 0.3        # below this -> d_null fallback
    temp: 0.1                 # softmax temperature over cosine sims

model:                        # Phases 2-3
  d_model: 256
  n_heads: 8
  n_layers: 8
  eps_mode: relative          # tau = log(dt / T_ctx); zero-gap/timeless -> structural bucket (exact invariance)
  geometry:
    absolute_anchor: false    # append log T_ctx to ctx(p) -> BREAKS strict invariance (ablation)
    content_modulated: false  # residual d_mu,d_sigma from [h_u;h_w] (v2 ablation)
    sigma_floor: 0.1          # sigma = softplus(.) + sigma_floor
    n_freq: 16                # Bochner features of tau

# Phases 4-8 (train/audit/transfer) are NOT built this session — keys added when those phases land.
