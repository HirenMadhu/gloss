# MoRE default config. Hydra-composable; standalone scripts read via OmegaConf.
# MoRE = RT cell-token substrate + a Mixture-of-Experts FFN routed on a value-free relational
# signature (column-name embedding + modality + recency). The retired DOC-RT (doc FiLM) and HALOS
# designs live under archive/.
seed: 0

data:
  dataset: rel-f1
  task: driver-dnf
  sampler:
    num_neighbors: [12, 12]    # per-hop fanout for the leakage-safe temporal neighbor sampler
  collate:
    seq_len: 512               # fixed cell-token cap per seed; rel-f1 max≈353 cells/seed -> 0% truncation
    max_fk: 5                  # max foreign-key neighbors per row (RT f2p_nbr width)
    max_rows: null             # R — rows per seed (row-graph axis). null = fit R to each batch, which
                               # is what you want: R is fanout- AND schema-coupled (it grows with
                               # num_neighbors and with the number of edge types), so a constant that
                               # fits one DB will not fit the next — a fixed 160 from rel-f1 killed
                               # every rel-event run. An int is honoured as a hard cap: it ASSERTS on
                               # overflow and never clamps.

# MoE FFN. `route_on` picks the router input (the load-bearing ablation axis); the S/C/P/H additions
# are OFF by default so the base arm == plain RT + top-k MoE. `run_train.py` / `run_ablation.py` flags
# override these.
moe:
  route_on: signature          # signature | hybrid(=signature+hidden) | hidden | value | identity | dense | dense_wide
  d_sig: 128                   # relational-signature width (router input dim for signature/identity)
  num_experts: 4
  k: 2                         # top-k experts per token
  lambda_ortho: 0.5            # router-orthogonality (+ HMoE level-1 balance) loss weight
  placement: all               # all | upper_half
  # --- ablation additions (default off) ---
  use_shared: false            # S: always-on shared expert
  cosine: false                # C: cosine/normalized router over learnable keys
  tau: 0.3                     #    cosine temperature
  top_p: null                  # P: adaptive expert count (keep smallest set reaching cumulative mass P)
  hmoe: false                  # H: hierarchical two-level gate (uses HMoEFFN)
  n_groups: 4                  #    HMoE: level-1 group count
  experts_per_group: 2         #    HMoE: experts per group
  k2: 1                        #    HMoE: within-group top-k2

model:
  arch: rt                     # rt | two_level   (rt = the current substrate; the A/B baseline)
  d_model: 256
  n_heads: 8
  n_blocks: 8                  # RelationalBlocks (each = col/feat/nbr/full attention + SwiGLU FFN)
  d_ff: 1024                   # SwiGLU inner dim (null -> 4*d_model)
  enc_channels: 256            # pytorch-frame stype-encoder out channels

  # --- two-level (cell, row) encoder. Ignored entirely when arch: rt. changes.md §4. ---
  # Defaults below are PHASE 0a: row tokens added, cell level still behaving exactly like RT
  # (four_mask + no cell RoPE + bucket recency), row biases off, mean pooling, dense row FFN.
  # That is what isolates the row-token addition; later phases flip one switch at a time.
  two_level:
    d_sig: 128                 # row-signature width (shares the value of moe.d_sig by convention)
    max_hop: 8                 # row_hop embedding size; a small universal integer, legal under §0
    cell:
      attention: four_mask     # four_mask (Phase 0a) | full (Phase 0b: 4 score matrices -> 1)
      rope_time: false         # Phase 1 t2 turns this on
      # HOW that attention is computed, not WHICH mask it uses. flex needs attention: full, and
      # gives up bit-exact --deterministic (its backward uses atomics). Its payoff scales with the
      # block grid: ~1.2-1.3x end-to-end at seq_len 512, but it is what makes 1536 affordable.
      backend: sdpa            # sdpa | flex   (gloss/model/flex_cell.py)
      # cell.ffn is NOT a switch here: it follows moe.route_on, because the cell MoE is the EXISTING
      # mechanism and stays unchanged. The MoE lives at BOTH levels (§3.7).
    row:
      pool_query: mean         # mean (Phase 0a) | signature | hidden | hybrid   (Phase 3 sweeps these)
      pool_slots: 4
      role_bias: none          # none (Phase 0a) | name_derived (Phase 2 s1). id_lookup is REMOVED (§3.5)
      time_bias: none          # none (Phase 0a) | rope (t3) | fixed_basis (t3b)
      ffn: dense               # dense | moe   (Phase 4 r1 turns the ROW MoE on; cell MoE stays on)
      num_experts: 4
      top_k: 2
      lambda_ortho: 0.5
      lambda_balance: 0.01     # M·Σ_e f_e p_e, over VALID rows only
    broadcast: additive        # additive | film | none
    head:
      mode: row_token          # row_token (§3.8) | seed_cells (kept for the Phase 0 parity check)

time:
  mode: buckets                # buckets (current, and REQUIRED by Phase 0a) | rope (Phase 1 t1+)
  unit: seconds                # canonical, not configurable per dataset — §3.1
  n_freq: 8
  # MEASURED band, not the [0.05, 5.0] changes.md first specified: tau's SPREAD is sigma≈1.6-1.9
  # (mean 14-18), so omega=0.05 varied by 0.08 rad across the whole corpus and 2 of 8 channels were
  # dead. Fixed constants in a non-persistent buffer — never learned.
  omega: [0.3, 5.0]
  causal_paths: false          # Phase 1 t4. NOTE: measured to be a SAMPLER change, not a mask change
                               # (rel-event: 55% of hop-adjacent pairs have the child LATER than its
                               # parent), so this flag is not yet implementable as written.

train:
  batch_size: 64
  lr: 3.0e-4
  weight_decay: 0.01
  max_epochs: 10
  num_workers: 0
