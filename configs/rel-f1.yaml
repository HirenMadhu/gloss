# rel-f1 (Ergast Formula-1) — the first dev dataset. Cached at ~/.cache/relbench/rel-f1.
# Inherits structure from default.yaml; only deltas are meaningful (scripts merge over default).
seed: 0

data:
  dataset: rel-f1
  task: driver-dnf             # binary EntityTask (did the driver Did-Not-Finish)
  sampler:
    num_neighbors: [12, 12]
  collate:
    seq_len: 512               # measured max≈353 cells/seed at num_neighbors=[12,12] -> 0% truncation
    max_fk: 5
    max_rows: null             # null = fit R to each batch (rel-f1 measured max 65 rows/seed at
                               # [12,12], 768 seeds). An int is a hard cap: asserted, never clamped.

model:
  d_model: 256
  n_heads: 8
  n_blocks: 8
  d_ff: 1024
  enc_channels: 256
