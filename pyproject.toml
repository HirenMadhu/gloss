[project]
name = "gloss"
version = "0.1.0"
description = "HALOS — a node-level temporal graph transformer whose attention geometry is generated from prose schema documentation."
readme = "README.md"
requires-python = ">=3.12"
# NOTE: the .venv is already provisioned. torch 2.8.0 was installed from the cu128 index
# (https://download.pytorch.org/whl/cu128) and torch_geometric/pyg extensions from
# https://data.pyg.org/whl/torch-2.8.0+cu128.html. These are NOT re-resolved here; this list
# documents the environment for reproducibility. Do not `uv sync` blindly over the working venv.
dependencies = [
    # --- relational substrate ---
    "torch>=2.8",
    "torch_geometric>=2.6",
    "pytorch-frame>=0.2",
    "relbench>=1.0",
    # --- frozen text encoder (Qwen3-Embedding-4B) ---
    "sentence-transformers>=3.0",
    "transformers>=4.51",
    # --- audit / baselines (later phases) ---
    "shap>=0.45",
    "lightgbm>=4.0",          # baseline only
    "scikit-learn",
    # --- utilities ---
    "numpy",
    "pandas",
    "pyyaml",
    "tqdm",
    # --- harness (Lightning training arrives in Phase 4) ---
    "pytorch-lightning",
    "hydra-core>=1.3",
    "wandb",
    "torchmetrics",
]

[project.optional-dependencies]
dev = ["pytest", "matplotlib", "ipdb"]
# flash-attn is built from source via scripts/build_flash_attn.sh (SLURM); its only consumer is the
# frozen Qwen encoder forward. HALOS's own attention uses PyTorch SDPA. Not declared here on purpose.

[tool.setuptools.packages.find]
where = ["."]
include = ["gloss*"]
exclude = ["tests*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
